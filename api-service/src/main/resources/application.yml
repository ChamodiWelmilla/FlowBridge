server:
  port: 8081

grpc:
  server:
    enabled: false
  client:
    processing-service:
      address: 'static://${GRPC_PROCESSING_SERVICE_HOST:localhost}:${GRPC_PROCESSING_SERVICE_PORT:9090}'
      negotiationType: PLAINTEXT

spring:
  application:
    name: api-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flowbridge}
    username: ${SPRING_DATASOURCE_USERNAME:flowuser}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USER:guest}
    password: ${SPRING_RABBITMQ_PASS:guest}

flowbridge:
  rabbitmq:
    exchange: flowbridge.direct
    routing-key: document.received
  jwt:
    secret: 9a6f8b12c4d5e7f80123456789abcdef9a6f8b12c4d5e7f80123456789abcdef
    expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.50, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
