version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowbridge-postgres
    environment:
      POSTGRES_DB: flowbridge
      POSTGRES_USER: flowuser
      POSTGRES_PASSWORD: flowpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowuser -d flowbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: flowbridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-service:
    build:
      context: ..
      dockerfile: api-service/Dockerfile
    container_name: flowbridge-api-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowbridge
      SPRING_DATASOURCE_USERNAME: flowuser
      SPRING_DATASOURCE_PASSWORD: flowpassword
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  processing-service:
    build:
      context: ..
      dockerfile: processing-service/Dockerfile
    container_name: flowbridge-processing-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowbridge
      SPRING_DATASOURCE_USERNAME: flowuser
      SPRING_DATASOURCE_PASSWORD: flowpassword
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  delivery-service:
    build:
      context: ..
      dockerfile: delivery-service/Dockerfile
    container_name: flowbridge-delivery-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowbridge
      SPRING_DATASOURCE_USERNAME: flowuser
      SPRING_DATASOURCE_PASSWORD: flowpassword
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
